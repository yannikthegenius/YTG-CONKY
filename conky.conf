conky.config = {

-- #############################
--    - Conky  Behavior -
-- #############################
    out_to_x = false,
    out_to_wayland = true,
    update_interval = 1,
    total_run_times = 0,
    cpu_avg_samples = 1,
    net_avg_samples = 1,
    imlib_cache_size = 0,
    double_buffer = true,
    no_buffers = true,





-- #############################
--     - Text Settings -     
-- #############################
    use_xft = true,
    font = 'Fira Book:normal:size=9',
    override_utf8_locale = true,
    text_buffer_size = 2048,





-- #############################
-- - Window Specifications - 
-- #############################
    own_window = true,
    own_window_type = desktop,
    own_window_transparent = false,
    own_window_argb_visual = false,
    own_window_hints = undecorated,sticky,skip_taskbar,skip_pager,below,
    own_window_argb_value = 300,
    own_window_colour = '#0C141F',
    draw_borders = false,
    minimum_width = 100,
    minimum_length = 100,
    draw_shades = true,
    draw_outline = false,
--  default_outline_color = 'yellow',
    default_shade_color = 'green',
    alignment = 'bottom_right',
    xinerama_head = 2,
    gap_x = 100,
    gap_y = -50,





-- #############################
--    - Color  Settings -    
-- #############################
    default_color = '#FFFFFF',
    default_shade_color = '#000000',
    color1 = '#FFFFFF',
    color2 = '#ad6eda',
    color3 = '#41d497',
};





-- #############################
--       - CONKY TEXT -    
-- #############################

conky.text = [[

# Uhr
${alignc}${font FiraBook:bold:size=65}${color3}${time %H:%M:%S}
${voffset -55}${alignc}${font FiraBook:bold:size=30}${color1}${time %A, %d. %B %Y}

# Disk Information (Free Storage)
${voffset -5}${alignc}${font FiraBook:size=14}${color3}DISK INFO:${color1}${color2}
${alignc}${color1}SSD 1:${color2} ${fs_bar 6,280 /} ${fs_free_perc /}% free
${alignc}${color2}${exec df -B1 / | tail -1 | awk '{print int($4/1000000000)" GB"}'} / ${exec df -B1 / | tail -1 | awk '{print int($2/1000000000)" GB"}'}

${voffset -10}
${alignc}${color1}SSD 2:${color2} ${fs_bar 6,280 /mnt/Data} ${fs_free_perc /mnt/Data}% free
${alignc}${color2}${exec df -B1 /mnt/Data | tail -1 | awk '{print int($4/1000000000)" GB"}'} / ${exec df -B1 /mnt/Data | tail -1 | awk '{print int($2/1000000000)" GB"}'}

# Uptime
${voffset -5}${alignc}${font FiraBook:size=14}${color3}PC UPTIME: ${color1}${uptime}${color0}

# VPN Section
${alignc}${color3}VPN STATUS:${color} ${execi 5 nmcli -t -f name connection show --active | grep -qi proton && echo "🟢 ON" || echo "🔴 OFF"}
${alignc}${color3}VPN SERVER:${color} ${execi 5 nmcli -t -f name connection show --active | grep -i proton | cut -d'/' -f1 | sed 's/.proton//g' | head -1 || echo "---"}





]];